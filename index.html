<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Our Notes 💌</title>

  <style>
    /* ========== RESET ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f3edf9 0%,
          #eee7f6 100%
        );

      min-height: 100vh;
      color: #333;

      overscroll-behavior: none;
    }

    .hidden {
      display: none !important;
    }

    /* ========== LOCK SCREEN ========== */
    .lock-screen {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        20px
        calc(24px + env(safe-area-inset-bottom));
      background:
        linear-gradient(
          135deg,
          #453969 0%,
          #5c274d 45%,
          #810505 100%
        );
    }

    .phone {
      width: 100%;
      max-width: 420px;
      background: rgba(12, 12, 14, 0.94);
      color: white;
      border-radius: 30px;
      padding: 48px 28px 36px;
      text-align: center;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .time {
      font-size: clamp(52px, 10vw, 72px);
      font-weight: 200;
      letter-spacing: -2px;
      margin: 0;
    }

    .lock-date {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .phone h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .phone input {
      width: 100%;
      padding: 15px;
      border:
        1px solid
        rgba(255, 255, 255, 0.06);
      border-radius: 15px;
      font-size: 20px;
      text-align: center;
      background:
        rgba(255, 255, 255, 0.08);
      color: white;
      outline: none;
      letter-spacing: 5px;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .phone input:focus {
      background:
        rgba(255, 255, 255, 0.11);
      border-color:
        rgba(196, 181, 253, 0.45);
      box-shadow:
        0 0 0 3px
        rgba(167, 139, 250, 0.10);
    }

    .phone button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: white;
      color: #161616;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      box-shadow:
        0 5px 16px
        rgba(0, 0, 0, 0.12);
    }

    .phone button:active {
      transform: scale(0.97);
    }

    .error {
      color: #ff8b8b;
      font-size: 14px;
      min-height: 20px;
    }

    /* ========== NOTES SCREEN ========== */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding-top:
        calc(24px + env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom:
        calc(110px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -0.5px;
      color: #633ca6;
    }

    #logout {
      background: white;
      border: 1px solid #ddd;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    /* ========== NOTE CARD ========== */
    .note {
      background:
        rgba(255, 255, 255, 0.92);
      padding: 20px;
      border-radius: 22px;
      margin-bottom: 16px;
      border:
        1px solid
        rgba(255, 255, 255, 0.7);
      box-shadow:
        0 2px 4px rgba(76, 29, 149, 0.03),
        0 8px 24px rgba(76, 29, 149, 0.07);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin: 0;
      padding: 0;
    }

    .note-left-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .author-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      color: white;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .author-badge.you {
      background:
        linear-gradient(
          135deg,
          #e696be,
          #db7bae
        );
    }

    .author-badge.him {
      background:
        linear-gradient(
          135deg,
          #818cf8,
          #6366f1
        );
    }

    .mood-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f5f3ff;
      color: #6d28d9;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .note-text {
      font-size: 16px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 16px 0 0 0;
      padding: 0;
    }

    .note-text a {
      color: #6d28d9;
      text-decoration: underline;
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }

    .note-text a:hover {
      color: #4c1d95;
    }

    .note-top-right {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-left: auto;
    }

    .note-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      text-align: right;
    }

    .note-meta small {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
    }

    .pinned-label {
      font-size: 11px;
      font-weight: 600;
      color: #7c3aed;
      background: #f3e8ff;
      padding: 4px 8px;
      border-radius: 999px;
    }

    /* ========== NOTE MENU ========== */
    .note-menu-wrapper {
      position: relative;
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #8b8b96;
      font-size: 23px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .menu-btn:active {
      background: #f3f0f7;
      transform: scale(0.88);
    }

    .note-menu {
      position: absolute;
      top: 40px;
      right: 0;
      width: 155px;
      padding: 6px;
      background:
        rgba(255, 255, 255, 0.98);
      border:
        1px solid
        rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.14);
      z-index: 50;
      transform-origin: top right;
      animation:
        menuOpen 0.16s ease-out;
    }

    .note-menu button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 11px 12px;
      border-radius: 10px;
      text-align: left;
      font-family: inherit;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    .note-menu button:active {
      transform: scale(0.97);
      background: #f5f3ff;
    }

    .note-menu .menu-delete-btn {
      color: #dc2626;
    }

    @keyframes menuOpen {
      from {
        opacity: 0;
        transform:
          scale(0.94)
          translateY(-4px);
      }

      to {
        opacity: 1;
        transform:
          scale(1)
          translateY(0);
      }
    }

    /* ========== ADD BUTTON ========== */
    .add-btn {
      position: fixed;
      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background:
        linear-gradient(
          135deg,
          #a78bfa,
          #ec4899
        );
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow:
        0 8px 25px
        rgba(167, 139, 250, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn:active {
      transform: scale(0.85);
      box-shadow:
        0 4px 15px
        rgba(167, 139, 250, 0.4);
    }

    /* ========== EMPTY STATE ========== */
    .empty {
      text-align: center;
      color: #9ca3af;
      margin-top: 60px;
    }

    /* ========== NOTE MODAL ========== */
    .modal {
      position: fixed;
      inset: 0;
      background:
        rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content {
      background: white;
      padding: 28px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      max-height:
        calc(100dvh - 40px);
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #7c3aed;
    }

    .modal-content label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #6b7280;
    }

    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 12px;
      border:
        1px solid
        #e5e7eb;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 16px;
      font-family: inherit;
    }

    .modal-content textarea {
      resize: none;
      overflow-y: hidden;
      min-height: 120px;
      max-height: 50vh;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    #cancel-btn {
      background: #f3f4f6;
    }

    #save-btn {
      background:
        linear-gradient(
          135deg,
          #a78bfa,
          #ec4899
        );
      color: white;
    }

    /* ========== IMAGE ATTACHMENTS ========== */
    .image-upload-section {
      margin-bottom: 18px;
    }
    .image-upload-section > label:first-child {
      display: block;
      margin-bottom: 8px;
    }

    #image-input {
      display: none;
    }

    .image-picker-btn {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: #f5f3ff;
      color: #6d28d9;
      border:
        1px solid
        #ddd6fe;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .image-picker-btn:active {
      transform: scale(0.96);
    }

    .image-preview-container {
      margin-top: 14px;
    }

    #image-preview {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.08);
    }

    #remove-image-btn {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .note-image {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 16px;
      margin-top: 14px;
      cursor: zoom-in;
      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.07);
      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    /* ========== IMAGE LIGHTBOX ========== */
    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        rgba(10, 10, 12, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(
          20px +
          env(safe-area-inset-top)
        )
        20px
        calc(
          20px +
          env(safe-area-inset-bottom)
        );
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter:
        blur(8px);
      animation:
        lightboxFadeIn
        0.2s ease;
    }

    .lightbox-image {
      display: block;
      max-width: 95%;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 14px;
      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.4);
      animation:
        lightboxImageIn
        0.2s ease;
    }

    .lightbox-close {
      position: absolute;
      top:
        calc(
          16px +
          env(safe-area-inset-top)
        );
      right: 18px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background:
        rgba(255, 255, 255, 0.14);
      color: white;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
    }

    .lightbox-close:active {
      transform: scale(0.9);
    }

    @keyframes lightboxFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes lightboxImageIn {
      from {
        opacity: 0;
        transform:
          scale(0.96);
      }
      to {
        opacity: 1;
        transform:
          scale(1);
      }
    }

    /* ========== BUTTON EFFECTS ========== */
    button {
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
      user-select: none;
    }
    button:active {
      transform: scale(0.92);
    }

    /* ========== DESKTOP HOVER ========== */
    @media (hover: hover) {
      .note:hover {
        transform:
          translateY(-2px);
        box-shadow:
          0 4px 8px
          rgba(76, 29, 149, 0.04),
          0 12px 30px
          rgba(76, 29, 149, 0.10);
      }

      .add-btn:hover {
        transform:
          scale(1.08);
      }

      .menu-btn:hover {
        background:
          #f3f0f7;
      }

      .note-menu button:hover {
        background:
          #f5f3ff;
      }

      .note-image:hover {
        transform:
          scale(1.01);
        filter:
          brightness(0.97);
      }
    }

    /* ========== MOBILE ========== */
    @media (max-width: 480px) {
      .lock-screen {
        padding:
          calc(
            40px +
            env(safe-area-inset-top)
          )
          24px
          calc(
            30px +
            env(safe-area-inset-bottom)
          );
        align-items: flex-start;
      }

      .phone {
        max-width: none;
        min-height:
          calc(
            100dvh
            - 70px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
          );

        background: transparent;
        border-radius: 0;
        box-shadow: none;
        padding:
          60px 0 20px;
      }

      .time {
        font-size: 58px;
      }

      .note-header {
        align-items: flex-start;
      }
      .note-left-meta {
        gap: 6px;
      }

      .mood-badge {
        font-size: 10px;
        padding: 4px 8px;
      }

      .note-meta small,
      .pinned-label {
        font-size: 11px;
      }

      .note-image {
        max-height: 380px;
        border-radius: 14px;
      }

      #image-preview {
        max-height: 260px;
      }

      .image-lightbox {
        padding:
          calc(
            12px +
            env(safe-area-inset-top)
          )
          10px
          calc(
            12px +
            env(safe-area-inset-bottom)
          );
      }

      .lightbox-image {
        max-width: 100%;
        max-height: 85vh;
        border-radius: 10px;
      }
    }

  </style>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
</head>

<body>

  <!-- ========== LOCK SCREEN ========== -->
  <div
    id="lock-screen"
    class="lock-screen">
    <div class="phone">
      <div
        class="time"
        id="time">
      </div>

      <div
        class="lock-date"
        id="lock-date">
      </div>

      <h1>
        Enter Password
      </h1>

      <input
        type="password"
        id="password"
        placeholder="••••"
        maxlength="20"
        autocomplete="current-password"
        autofocus
      >

      <button
        type="button"
        id="unlock-btn">
        Unlock
      </button>

      <p
        id="error"
        class="error">
      </p>

    </div>

  </div>

  <!-- ========== NOTES SCREEN ========== -->
  <div
    id="notes-screen"
    class="hidden">
    <div class="container">
      <header>
        <h1>
          Our Notes ✉︎
        </h1>
        <button
          type="button"
          id="logout">
          Lock
        </button>
      </header>

      <div id="notes-list"></div>
      <button
        type="button"
        id="add-note-btn"
        class="add-btn"
        aria-label="Add note">
        +
      </button>

      <!-- ========== ADD / EDIT NOTE MODAL ========== -->
      <div
        id="modal"
        class="modal hidden">
        <div class="modal-content">
          <h3 id="modal-title">
            Add a note
          </h3>
          <label for="author">
            Who wrote it?
          </label>
          <select id="author">
            <option value="You">
              You
            </option>
            <option value="Him">
              Him
            </option>
          </select>

          <label for="mood">
            How are you feeling?
          </label>

          <select id="mood">
            <option value="">
              No mood
            </option>
            <option value="Happy">
              😊 Happy
            </option>
            <option value="Loved">
              🥰 Loved
            </option>
            <option value="Stressed">
              😣 Stressed
            </option>
            <option value="Mad">
              😠 Mad
            </option>
            <option value="Sad">
              😢 Sad
            </option>
            <option value="Annoyed">
              😒 Annoyed
            </option>
            <option value="Proud">
              🥹 Proud
            </option>
            <option value="Sleepy">
              😴 Sleepy
            </option>
          </select>

          <textarea
            id="note-content"
            placeholder="Leave a note..."
            rows="5">
          </textarea>

          <!-- IMAGE ATTACHMENT -->
          <div class="image-upload-section">
            <label>
              Attach a photo
            </label>
            <input
              type="file"
              id="image-input"
              accept="image/*"
            >
            <label
              for="image-input"
              class="image-picker-btn">
              📷 Choose Photo
            </label>

            <div
              id="image-preview-container"
              class="image-preview-container hidden">
              <img
                id="image-preview"
                alt="Selected photo preview"
              >

              <button
                type="button"
                id="remove-image-btn">
                Remove photo
              </button>

            </div>

          </div>

          <div class="modal-actions">
            <button
              type="button"
              id="cancel-btn">
              Cancel
            </button>
            <button
              type="button"
              id="save-btn">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== IMAGE FULLSCREEN PREVIEW ========== -->
  <div
    id="image-lightbox"
    class="image-lightbox hidden">
    <button
      id="lightbox-close"
      class="lightbox-close"
      type="button"
      aria-label="Close image">
      ×
    </button>
    <img
      id="lightbox-image"
      class="lightbox-image"
      alt="Full size note attachment"
    >
  </div>
  <script src="app.js"></script>
</body>
</html>
