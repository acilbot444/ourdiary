<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Notes 💌</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #efe8f7;
      min-height: 100vh;
      color: #333;
      overscroll-behavior: none;
    }

    .hidden {
      display: none !important;
    }

    /* LOCK SCREEN */
    .lock-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #453969, #810505);
      padding: 20px;
    }

    .phone {
      background: #111;
      color: white;
      width: 320px;
      height: 580px;
      border-radius: 40px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
    }

    .phone::before {
      content: '';
      position: absolute;
      top: 12px;
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 20px;
    }

    .time {
      font-size: 52px;
      font-weight: 200;
      margin-top: 40px;
      margin-bottom: 30px;
    }

    .phone h1 {
      font-size: 22px;
      font-weight: 500;
    }

    .phone input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      text-align: center;
      background: #222;
      color: white;
      outline: none;
      letter-spacing: 4px;
    }

    .phone button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .error {
      color: #ff6b6b;
      font-size: 14px;
      min-height: 20px;
    }

    /* NOTES SCREEN */
    .container {
      max-width: 700px;
      margin: 0 auto;
      
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #6c42b5;
    }

    #logout {
      background: white;
      border: 1px solid #ddd;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .note {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .author-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      color: white;
    }

    .author-badge.you {
      background: #e696be;
    }

    .author-badge.him {
      background: #6366f1;
    }

    .note-text {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .note-actions {
      display: flex;
      gap: 10px;
    }

    .edit-btn, .delete-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }

    .edit-btn {
      background: #e0e7ff;
      color: #4338ca;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      margin-top: 60px;
    }

    .add-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content {
      background: white;
      padding: 28px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #7c3aed;
    }

    .modal-content label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #6b7280;
    }

    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 16px;
      font-family: inherit;
    }

    .modal-content textarea {
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    #cancel-btn {
      background: #f3f4f6;
    }

    #save-btn {
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      color: white;
    }
  
  /* ========== Interactive Button Effects ========== */

/* General press effect for all buttons */
button {
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
}

button:active {
  transform: scale(0.92);
}

/* Floating + button special effect */
.add-btn {
  bottom: calc(20px + env(safe-area-inset-bottom));
    right: 20px;
    width: 60px;
    height: 60px;
  /* transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;*/
}

.add-btn:active {
  transform: scale(0.85);
  box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
}

/* Unlock button */
.phone button:active {
  transform: scale(0.95);
}

/* Edit & Delete buttons */
.edit-btn:active,
.delete-btn:active {
  transform: scale(0.9);
}

/* Modal buttons */
.modal-actions button:active {
  transform: scale(0.95);
}

/* Optional: small bounce when hovering (desktop) */
@media (hover: hover) {
  .add-btn:hover {
    transform: scale(1.08);
  }
  
  .edit-btn:hover,
  .delete-btn:hover {
    transform: scale(1.05);
  }
}  
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lock-screen" class="lock-screen">
    <div class="phone">
      <div class="time" id="time"></div>
      <h1>Enter Password</h1>
      <input type="password" id="password" placeholder="••••" maxlength="20" autofocus>
      <button id="unlock-btn">Unlock</button>
      <p id="error" class="error"></p>
    </div>

  </div>

  <!-- NOTES SCREEN -->
  <div id="notes-screen" class="hidden">
    <div class="container">
      <header>
        <h1>Our Notes ✉︎</h1>
        <button id="logout">Lock</button>
      </header>

      <div id="notes-list"></div>

      <button id="add-note-btn" class="add-btn">+</button>

      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="modal-title">Add a note</h3>
          
          <label for="author">Who wrote it?</label>
          <select id="author">
            <option value="You">You</option>
            <option value="Him">Him</option>
          </select>

          <textarea id="note-content" placeholder="Leave a note..." rows="5"></textarea>

          <div class="modal-actions">
            <button id="cancel-btn">Cancel</button>
            <button id="save-btn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
